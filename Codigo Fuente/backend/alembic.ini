# Configuración de Alembic. La URL de la base de datos NO se escribe aquí:
# se toma de FORECAST_DATABASE_URL (ver migrations/env.py y .env.example).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = src
file_template = %%(rev)s_%%(slug)s
path_separator = os
output_encoding = utf-8

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
