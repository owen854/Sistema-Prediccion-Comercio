# Fuentes de datos (RF-01 a RF-04). Periodos y reglas tomados del Informe de evidencia
# OE1/OE2 (Tablas III y IV). La Fase 1 reproduce esos conteos de meses.
# Los archivos descargados quedan en data/raw/public/ y se registran en data/manifest.json.

dane_emc:
  descripcion: Índice de ventas reales del comercio minorista, total sin otros vehículos (base 2019 = 100)
  pagina: https://www.dane.gov.co/index.php/estadisticas-por-tema/comercio-interno/encuesta-mensual-de-comercio-emc
  url: https://www.dane.gov.co/files/operaciones/EMC/anex-EMC-SeriesIndiceEmpalmados-{mes}{anio}.xlsx
  corte_informe: { mes: ago, anio: 2026 }
  archivo: anex-EMC-SeriesIndiceEmpalmados-ago2026.xlsx
  hoja: "1.2"                      # índices empalmados de las ventas en valores reales
  columna: Total comercio minorista sin otros vehículos
  frecuencia: MS
  nivel: nacional
  periodo_informe: { inicio: "2013-01", fin: "2026-08", meses: 164 }
  nota: >
    El anexo departamental publica solo 6 departamentos y "Otros departamentos"; no incluye
    Norte de Santander. La demanda regional se aproxima con la serie nacional (limitación del informe).

dane_ipc:
  descripcion: Variación mensual del IPC por ciudades
  pagina: https://www.dane.gov.co/index.php/estadisticas-por-tema/precios-y-costos/indice-de-precios-al-consumidor-ipc
  frecuencia: MS
  ciudades: [Cúcuta, Nacional]
  periodo_informe: { inicio: "2017-01", fin: "2026-09", meses: 117 }
  reconstruccion_indice: { base: "2016-12", valor_base: 100 }
  # El anexo mensual (anex-IPC-<mes><anio>.xlsx, hoja "4") trae solo el mes publicado.
  # La historia 2017-2026 por ciudad se carga desde este CSV (columnas: fecha, ciudad, variacion_pct).
  archivo_historico: ipc_variacion_mensual_ciudades.csv
  estado: pendiente  # falta el archivo histórico original usado en el informe

migracion_colombia:
  descripcion: Entradas de extranjeros a Colombia por puesto migratorio
  api: https://www.datos.gov.co/resource/96sh-4v8d.json
  dataset_id: 96sh-4v8d
  archivo: migracion_nds_96sh-4v8d.json
  frecuencia: MS
  # Los puestos vienen identificados por coordenadas (columna "Ubicación PCM"). Estos 5 suman
  # 3.411.542 entradas desde 2012, la cifra del informe.
  puestos_norte_de_santander:
    "(7.818934,-72.453226)": Puente Simón Bolívar (Villa del Rosario)
    "(7.916725,-72.462544)": Puente Francisco de Paula Santander (Cúcuta)
    "(7.927209,-72.507910)": Aeropuerto Camilo Daza (Cúcuta)
    "(8.364293,-72.405710)": Puerto Santander
    "(8.36068,-72.409396)": Puerto Santander (segundo registro)
  periodo_informe: { inicio: "2012-01", fin: "2026-06", meses: 174 }
  faltantes:
    "2020-04": 0  # sin registros por cierre de la frontera; se toma como 0 entradas (informe)
  registros_sin_puesto: excluir  # 106 de 44,9 millones en el informe ("No Aplica")

trm:
  descripcion: Tasa de Cambio Representativa del Mercado COP/USD (Superintendencia Financiera)
  api: https://www.datos.gov.co/resource/32sa-8pi3.json
  dataset_id: 32sa-8pi3
  archivo: trm_32sa-8pi3.json
  desde: "2012-01-01"
  frecuencia: D
  relleno: hacia_adelante  # fines de semana y festivos toman la última TRM vigente

panel_lstm_informe:
  descripcion: Panel de ventas y entradas usado por el piloto LSTM
  periodo: { inicio: "2013-01", fin: "2026-06", meses: 162 }
