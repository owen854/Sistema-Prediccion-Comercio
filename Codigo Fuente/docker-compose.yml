# Despliegue y demostración (RNF-08). En desarrollo no es obligatorio (ADR-007).
# Uso:  cp .env.example .env && docker compose up --build
# El worker se activa desde la Fase 4:  docker compose --profile worker up

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forecast}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forecast}
      POSTGRES_DB: ${POSTGRES_DB:-forecast}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-forecast}"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      FORECAST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-forecast}:${POSTGRES_PASSWORD:-forecast}@db:5432/${POSTGRES_DB:-forecast}
      FORECAST_CORS_ORIGINS: '["http://localhost:3000"]'
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./experiments:/app/experiments

  worker:
    profiles: ["worker"]
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    environment:
      FORECAST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-forecast}:${POSTGRES_PASSWORD:-forecast}@db:5432/${POSTGRES_DB:-forecast}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./experiments:/app/experiments

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
